syntax = "proto3";

package menu.pos_context;

option go_package = "github.com/InBitGT/proto-definitions/menu/pos_context;posctxpb";

service POSContextService {
  rpc GetPOSContext (GetPOSContextRequest) returns (GetPOSContextResponse);
}

message GetPOSContextRequest {
  repeated uint64 product_ids      = 1;
  uint64          tenant_id        = 2;
  uint64          customer_type_id = 3;
}

message POSPricePerUom {
  uint64 id                = 1;
  uint64 uom_id             = 2;
  double amount             = 3;
  string currency           = 4;
  double wholesale_min_qty  = 5;
  double wholesale_amount   = 6;
}

message POSCustomerTypePrice {
  uint64 id                 = 1;
  uint64 customer_type_id   = 2;
  double amount             = 3;
  string currency           = 4;
  string customer_type_name = 5; // ← nuevo
}

// ── Variante disponible del producto (nuevo) ──────────────────────────
message POSVariant {
  uint64 id               = 1;
  string name             = 2;
  double price_adjustment = 3;
  string adjustment_type  = 4;
}

// ── Modificador ASIGNADO al producto (nuevo) ──────────────────────────
// En la venta se manda modifier_product_id, no product_modifier_id.
message POSModifier {
  uint64 product_modifier_id = 1;
  uint64 modifier_product_id = 2;
  double quantity            = 3;
  int32  min_selection       = 4;
  int32  max_selection       = 5;
  double price_adjustment    = 6;
  bool   is_default          = 7;
  string modifier_type       = 8;
}

message POSProductContext {
  uint64 product_id              = 1;
  double base_price              = 2;
  string currency                = 3;

  bool   has_promotion           = 4;
  uint64 promotion_id            = 5;
  string promotion_name          = 6;
  string promotion_discount_type = 7;
  double promotion_value         = 8;

  bool   has_customer_type_price = 9;
  double customer_type_price     = 10;

  bool   has_wholesale           = 11;
  double wholesale_min_qty       = 12;
  double wholesale_discount_pct  = 13;

  repeated POSPricePerUom price_per_uom = 14;

  repeated POSCustomerTypePrice customer_type_prices = 15;

  repeated POSVariant  variants  = 16; // ← nuevo
  repeated POSModifier modifiers = 17; // ← nuevo
}

message GetPOSContextResponse {
  bool                       success  = 1;
  repeated POSProductContext products = 2;
}
