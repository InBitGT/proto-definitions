syntax = "proto3";

package menu.product_price;

option go_package = "github.com/InBitGT/proto-definitions/menu/product_price;productpricepb";

service ProductPriceService {
  rpc CreatePrice                       (CreatePriceRequest)                       returns (CreatePriceResponse);
  rpc UpdatePrice                       (UpdatePriceRequest)                       returns (UpdatePriceResponse);
  rpc GetPriceByProductID               (GetPriceByProductIDRequest)               returns (GetPriceByProductIDResponse);
  rpc GetPricesByProductIDs             (GetPricesByProductIDsRequest)             returns (GetPricesByProductIDsResponse);             // ← batch precio base
  rpc CreatePriceCustomerType           (CreatePriceCustomerTypeRequest)           returns (CreatePriceCustomerTypeResponse);
  rpc GetPriceCustomerTypesByProductID  (GetPriceCustomerTypesByProductIDRequest)  returns (GetPriceCustomerTypesByProductIDResponse);
  rpc GetPriceCustomerTypesByProductIDs (GetPriceCustomerTypesByProductIDsRequest) returns (GetPriceCustomerTypesByProductIDsResponse); // ← batch customer
  rpc DeletePriceCustomerTypeByProduct  (DeleteByProductRequest)                   returns (DeleteByProductResponse);
  rpc CreatePricePerUom                 (CreatePricePerUomRequest)                 returns (CreatePricePerUomResponse);
  rpc GetPricePerUomByProductID         (GetPricePerUomByProductIDRequest)         returns (GetPricePerUomByProductIDResponse);
  rpc GetPricePerUomByProductIDs        (GetPricePerUomByProductIDsRequest)        returns (GetPricePerUomByProductIDsResponse);        // ← batch price_per_uom
  rpc DeletePricePerUomByProduct        (DeleteByProductRequest)                   returns (DeleteByProductResponse);
}

// ── Price ─────────────────────────────────────────────────────────────

message CreatePriceRequest {
  uint64 product_id = 1;
  double amount     = 2;
  string currency   = 3;
}
message CreatePriceResponse {
  bool   success  = 1;
  uint64 price_id = 2;
  double amount   = 3;
  string currency = 4;
}
message UpdatePriceRequest {
  uint64 product_id = 1;
  double amount     = 2;
  string currency   = 3;
}
message UpdatePriceResponse {
  bool success = 1;
}
message GetPriceByProductIDRequest {
  uint64 product_id = 1;
}
message GetPriceByProductIDResponse {
  bool   success  = 1;
  uint64 price_id = 2;
  double amount   = 3;
  string currency = 4;
  bool   is_base  = 5;
}

// ── GetPricesByProductIDs — batch precio base ─────────────────────────
message GetPricesByProductIDsRequest {
  repeated uint64 product_ids = 1;
}
message PriceItem {
  uint64 product_id = 1;
  uint64 price_id   = 2;
  double amount     = 3;
  string currency   = 4;
  bool   is_base    = 5;
}
message GetPricesByProductIDsResponse {
  bool             success = 1;
  repeated PriceItem prices = 2;
}

// ── PriceCustomerType ─────────────────────────────────────────────────

message PriceCustomerTypeItem {
  uint64 customer_type_id = 1;
  double amount           = 2;
  string currency         = 3;
}
message CreatePriceCustomerTypeRequest {
  uint64                         product_id = 1;
  repeated PriceCustomerTypeItem items      = 2;
}
message CreatePriceCustomerTypeResponse {
  bool  success = 1;
  int32 created = 2;
}
message GetPriceCustomerTypesByProductIDRequest {
  uint64 product_id = 1;
}
message PriceCustomerTypeResult {
  uint64 id               = 1;
  uint64 customer_type_id = 2;
  double amount           = 3;
  string currency         = 4;
}
message GetPriceCustomerTypesByProductIDResponse {
  bool                             success = 1;
  repeated PriceCustomerTypeResult items   = 2;
}

// ── GetPriceCustomerTypesByProductIDs — batch ─────────────────────────
message GetPriceCustomerTypesByProductIDsRequest {
  repeated uint64 product_ids     = 1;
  uint64          customer_type_id = 2; // opcional — si viene, filtra por tipo
}
message PriceCustomerTypeBatchResult {
  uint64 product_id       = 1;
  uint64 id               = 2;
  uint64 customer_type_id = 3;
  double amount           = 4;
  string currency         = 5;
}
message GetPriceCustomerTypesByProductIDsResponse {
  bool                                  success = 1;
  repeated PriceCustomerTypeBatchResult items   = 2;
}

// ── PricePerUom ───────────────────────────────────────────────────────

message PricePerUomItem {
  uint64 uom_id            = 1;
  double amount            = 2;
  string currency          = 3;
  double wholesale_min_qty = 4;
  double wholesale_amount  = 5;
}
message CreatePricePerUomRequest {
  uint64                   product_id = 1;
  repeated PricePerUomItem items      = 2;
}
message CreatePricePerUomResponse {
  bool  success = 1;
  int32 created = 2;
}
message GetPricePerUomByProductIDRequest {
  uint64 product_id = 1;
}
message PricePerUomResult {
  uint64 id                = 1;
  uint64 uom_id            = 2;
  double amount            = 3;
  string currency          = 4;
  double wholesale_min_qty = 5;
  double wholesale_amount  = 6;
}
message GetPricePerUomByProductIDResponse {
  bool                       success = 1;
  repeated PricePerUomResult items   = 2;
}

// ── GetPricePerUomByProductIDs — batch ───────────────────────────────
message GetPricePerUomByProductIDsRequest {
  repeated uint64 product_ids = 1;
}
message PricePerUomBatchResult {
  uint64 product_id        = 1;
  uint64 id                = 2;
  uint64 uom_id            = 3;
  double amount            = 4;
  string currency          = 5;
  double wholesale_min_qty = 6;
  double wholesale_amount  = 7;
}
message GetPricePerUomByProductIDsResponse {
  bool                          success = 1;
  repeated PricePerUomBatchResult items = 2;
}

// ── Shared ────────────────────────────────────────────────────────────

message DeleteByProductRequest {
  uint64 product_id = 1;
}
message DeleteByProductResponse {
  bool success = 1;
}
