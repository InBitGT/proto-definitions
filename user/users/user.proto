syntax = "proto3";

package user;

option go_package = "github.com/InBitGT/proto-definitions/user/users";

service UserService {
  rpc GetUserByEmail      (GetUserByEmailRequest)      returns (UserAuthResponse);
  rpc GetUserByID         (GetUserByIDRequest)         returns (UserAuthResponse);
  rpc GetUsersByTenantID  (GetUsersByTenantIDRequest)  returns (GetUsersByTenantIDResponse);
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserByIDRequest {
  uint64 id = 1;
}

message GetUsersByTenantIDRequest {
  uint64 tenant_id = 1;
}

message UserListItem {
  uint64 id         = 1;
  string username   = 2;
  string first_name = 3;
  string last_name  = 4;
  string role_name  = 5;
  bool   is_active  = 6;
}

message GetUsersByTenantIDResponse {
  bool                  success = 1;
  repeated UserListItem users   = 2;
}

message Warehouse {
  uint64 warehouse_id   = 1;
  string warehouse_name = 2;
}

message Branch {
  uint64 branch_id              = 1;
  string branch_name            = 2;
  repeated Warehouse warehouses = 3;
}

message UserAuthResponse {
  uint64 id            = 1;
  uint64 tenant_id     = 2;
  string email         = 3;
  string username      = 4;
  string password_hash = 5;
  string first_name    = 6;
  string last_name     = 7;
  uint64 role_id       = 8;
  string role_name     = 9;
  bool   is_active     = 10;
  bool   status        = 11;
  string tenant_name   = 12;
  reserved 13, 14;
  repeated Branch branches = 15;
}
