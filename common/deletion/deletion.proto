syntax = "proto3";

package deletion;

option go_package = "github.com/InBitGT/proto-definitions/common/deletion";

service TenantDeletionService {
  rpc DeleteTenantData (DeleteTenantDataRequest) returns (DeleteTenantDataResponse);
}

message IDList {
  repeated uint64 ids = 1;
}

message DeleteTenantDataRequest {
  uint64              tenant_id = 1;
  bool                dry_run   = 2;
  map<string, IDList> scope     = 3;
  string              reason    = 4;
}

message TableCount {
  string table = 1;
  int64  rows  = 2;
}

message DeleteTenantDataResponse {
  bool                success       = 1;
  string              service       = 2;
  string              error_message = 3;
  repeated TableCount tables        = 4;
  map<string, IDList> exported      = 5;
  bool                dry_run       = 6;
}
